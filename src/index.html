<!doctype html>
<html lang="en-IN" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>KŌRA — Everyday Garments</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KŌRA makes everyday garments in heavy cotton and honest wool: coats, knits, shirts and tees, cut to be worn for years.">
  <meta name="theme-color" content="oklch(0.972 0.008 85)" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="oklch(0.16 0.008 70)" media="(prefers-color-scheme: dark)">
  <!-- KŌRA K monogram: SVG for modern browsers, .ico fallback, home-screen icons -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    // Apply the saved theme before first paint. Light ("Bone & Ink") is the default.
    try {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
